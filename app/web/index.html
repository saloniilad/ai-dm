<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Dungeon Master</title>
<style>
:root{--bg:#14110f;--panel:#1e1a17;--ink:#eadfd0;--dim:#9b8f80;--acc:#d9a441;--me:#2b3a2f}
@media (prefers-color-scheme: light){:root{--bg:#f4ede1;--panel:#fffaf0;--ink:#2a2118;--dim:#7a6c5a;--acc:#9a6a12;--me:#dfe8d6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;border-bottom:1px solid var(--dim);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;color:var(--acc);flex:1}
main{flex:1;display:flex;min-height:0}#log{flex:1;overflow:auto;padding:16px}
aside{width:230px;padding:16px;border-left:1px solid var(--dim);background:var(--panel);font-size:14px;overflow:auto}
.m{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:var(--panel);white-space:pre-wrap}.m.me{background:var(--me)}
.tool{color:var(--dim);font:12px monospace;margin-top:6px}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--dim)}
input,button{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--dim);background:var(--panel);color:var(--ink)}
#action{flex:1}button{background:var(--acc);color:#14110f;border:0;cursor:pointer}
@media(max-width:640px){aside{display:none}}
</style></head><body>
<header><h1>The Drowned Lotus — AI Dungeon Master</h1>
<input id="name" placeholder="Hero name"><input id="sid" placeholder="Session (optional)"><button id="start">Begin</button></header>
<main><div id="log"></div><aside id="state">Press Begin.</aside></main>
<form id="f"><input id="action" placeholder="What do you do?" autocomplete="off" disabled><button disabled id="send">Act</button></form>
<script>
let sid=null,player=null;const $=id=>document.getElementById(id);
function add(text,cls,tools){const d=document.createElement('div');d.className='m '+(cls||'');d.textContent=text;
 if(tools&&tools.length){const t=document.createElement('div');t.className='tool';
  t.textContent=tools.map(x=>x.name+'('+JSON.stringify(x.args)+') → '+JSON.stringify(x.result)).join('\n');d.appendChild(t)}
 $('log').appendChild(d);$('log').scrollTop=1e9}
function show(s){$('state').innerHTML='<b>'+s.name+'</b><br>HP '+s.hp+'/'+s.max_hp+'<br>Gold '+s.gold+
 '<br>Location: '+s.location+'<br>Hours travelled: '+s.hours+'<hr>Stats: '+JSON.stringify(s.stats)+
 '<hr>Items:<br>'+s.inventory.map(i=>'• '+i).join('<br>')+'<hr>Milestones:<br>'+(s.flags.join('<br>')||'—')}
async function j(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
 if(!r.ok)throw new Error((await r.json()).detail||r.status);return r.json()}
$('start').onclick=async()=>{try{player=$('name').value.trim()||'Wanderer';
 const r=await j('/sessions',{player,session_id:$('sid').value.trim()||null});sid=r.session_id;show(r.state);
 add('Session '+sid+' ['+r.backend+']. You stand at '+r.state.location+'.');
 const rc=await j('/sessions/'+sid+'/recap');add(rc.recap);$('action').disabled=$('send').disabled=false;$('action').focus()}catch(e){add('Error: '+e.message)}};
$('f').onsubmit=async e=>{e.preventDefault();const a=$('action').value.trim();if(!a)return;$('action').value='';add(a,'me');
 try{const r=await j('/sessions/'+sid+'/act',{player,action:a});add(r.narration,'',r.tools);show(r.state)}catch(e){add('Error: '+e.message)}};
</script></body></html>
